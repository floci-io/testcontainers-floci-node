version: 2
updates:
  # Titles must be Conventional Commits: the pull-request title is checked by commit lint and becomes
  # the squash commit, which release-please reads.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Runtime dependencies reach every consumer (fix: changelog and release); dev dependencies don't.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      test-tooling:
        patterns:
          - "jest"
          - "ts-jest"
          - "@types/*"
          - "typescript"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"

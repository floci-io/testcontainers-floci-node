name: Publish to npm

on:
  release:
    types: [published]
  # Re-publish an existing release tag with the current workflow, for example after a failed
  # publish. The tagged source is built and published; the workflow file comes from the
  # branch the dispatch runs on.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example 0.2.0)"
        required: true

permissions:
  contents: read
  id-token: write  # required for npm trusted publishing (OIDC)

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@floci/testcontainers
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Trusted publishing (OIDC login) needs npm >= 11.5.1; Node 20 ships npm 10.x, which signs
      # provenance but cannot log in with the OIDC token, so the registry answers E404.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11 && npm --version

      - name: Publish to npm
        run: npm publish --provenance --access public

  publish-beta:
    name: Publish beta to npm (pre-release)
    if: github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm-beta
      url: https://www.npmjs.com/package/@floci/testcontainers
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11 && npm --version

      - name: Publish beta to npm
        run: npm publish --provenance --access public --tag beta

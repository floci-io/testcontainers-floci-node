name: Semantic Release

# Runs semantic-release on every push to main that touches the package. It analyses the
# Conventional Commits since the last X.Y.Z tag, decides the bump (none for docs/chore/ci),
# updates CHANGELOG.md + package.json, commits them, pushes the tag and creates the GitHub
# release. That release triggers publish.yml, which publishes to npm via OIDC.
#
# Tags have no v prefix (tagFormat "${version}"). 0.1.0 was published to npm by hand and
# tagged afterwards on its source commit, so releases continue from there in 0.x.
#
# Required secrets: GH_TOKEN (PAT with contents: write)
# No NPM_TOKEN needed: npmPublish is disabled here; publish.yml handles npm via OIDC.

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.releaserc.json'
      - '.github/workflows/semver.yml'

# One release at a time: semantic-release pushes a release commit and a tag, so overlapping
# runs from merges close together would race. Queue them; never cancel a release mid-way.
concurrency:
  group: semantic-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/npm
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
